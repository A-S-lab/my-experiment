<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミュラー・リヤー錯視実験 (Müller-Lyer Illusion)</title>
  
  <!-- jsPsych core and plugins via CDN -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-canvas-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

  <!-- Tailwind CSS for elegant design -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* 画面全体の中央配置 & ダーク/ライトに調和する洗練されたスタイル */
    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    }
    .jspsych-content-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .jspsych-content {
      max-width: 800px;
      width: 100%;
      padding: 2rem;
    }
    /* キャンバスの枠線と影 */
    canvas {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background-color: #ffffff;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
    }
    /* サーベイ画面のフォームデザイン微調整 */
    .jspsych-survey-text-question input[type="text"] {
      width: 100% !important;
      max-width: 320px;
      margin: 0.75rem auto !important;
      padding: 0.625rem 0.875rem !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 0.5rem !important;
      font-size: 1rem !important;
      text-align: center;
      box-shadow: inset 0 1px 2px 0 rgb(0 0 0 / 0.05);
      transition: all 0.2s;
    }
    .jspsych-survey-text-question input[type="text"]:focus {
      outline: none;
      border-color: #4f46e5 !important;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15) !important;
    }
    .jspsych-btn {
      background-color: #4f46e5 !important;
      border-radius: 0.5rem !important;
      padding: 0.75rem 2rem !important;
      font-weight: 600 !important;
      font-size: 0.95rem !important;
      transition: all 0.2s !important;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }
    .jspsych-btn:hover {
      background-color: #4338ca !important;
      box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.3);
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>

  <script>
    // --- 送信先GASウェブアプリのURL設定 ---
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxCYz1C4JScfHwmKlLArA4w1BkhJRHee3GNeh12w0U0Cq8FPER_bhl4CrhVJQhoGKEe9g/exec';

    // jsPsychの初期化
    const jsPsych = initJsPsych({
      display_element: 'jspsych-target'
    });

    // 実験パラメータの定義
    const conditions = [
      { shaft_angle: 15, fin_length: 20 },
      { shaft_angle: 15, fin_length: 50 },
      { shaft_angle: 75, fin_length: 20 },
      { shaft_angle: 75, fin_length: 50 }
    ];

    // 試行回数の設定 (4条件 × 3回 = 12試行)
    const repetitions = 3;
    let trial_list = [];
    for (let i = 0; i < repetitions; i++) {
      trial_list = trial_list.concat(JSON.parse(JSON.stringify(conditions)));
    }
    // シャッフル
    trial_list = jsPsych.randomization.shuffle(trial_list);

    // タイムラインの配列
    const timeline = [];

    // --- 0. 学籍番号（参加者ID）入力画面 ---
    const id_input_screen = {
      type: jsPsychSurveyText,
      questions: [
        { 
          prompt: `
            <div class="text-center mb-4">
              <h1 class="text-2xl font-bold text-slate-800 mb-2">実験開始前の確認</h1>
              <p class="text-sm text-slate-500">データを記録するため、学籍番号（または参加者ID）を入力してください。</p>
            </div>
          `, 
          placeholder: "例: 2026X1234",
          name: 'student_id', 
          required: true 
        }
      ],
      button_label: '次へ進む',
      on_finish: function(data) {
        // 学籍番号と開始時のタイムスタンプをすべてのデータに紐付け
        jsPsych.data.addProperties({
          subject_id: data.response.student_id,
          timestamp: new Date().toLocaleString('ja-JP')
        });
      }
    };
    timeline.push(id_input_screen);

    // --- 1. インストラクション (教示画面) ---
    const instructions = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div class="text-left max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200">
          <h1 class="text-2xl font-bold text-center text-indigo-700 mb-6">ミュラー・リヤー錯視実験</h1>
          <p class="mb-4 leading-relaxed">
            この実験では、画面に上下2本の線（矢羽付きの線）が表示されます。
          </p>
          <ul class="list-disc pl-6 mb-6 space-y-2 text-slate-600">
            <li><strong>上側の線</strong>は、長さが固定された<strong>標準刺激（内向きの矢羽）</strong>です。</li>
            <li><strong>下側の線</strong>は、長さを自由に変更できる<strong>比較刺激（外向きの矢羽）</strong>です。</li>
          </ul>
          <p class="mb-4 leading-relaxed">
            キーボードの <strong>左矢印キー（←）</strong> および <strong>右矢印キー（→）</strong> を使用して、
            下側の線の長さが、上側の線と<strong>「心理的に全く同じ長さ」</strong>に見えるように調整してください。
            （キーを押し続けることで、連続して長さを変えることができます）
          </p>
          <p class="mb-6 leading-relaxed text-indigo-600 font-semibold text-center">
            調整が完了したら、スペースキーを押して決定し、次の試行へ進んでください。
          </p>
          <div class="text-center">
            <span class="inline-block bg-indigo-600 text-white font-medium px-6 py-3 rounded-lg shadow hover:bg-indigo-700 transition cursor-pointer">
              スペースキーを押して実験を開始する
            </span>
          </div>
        </div>
      `,
      choices: [' ']
    };
    timeline.push(instructions);

    // --- 2. 実験試行（ループ用テンプレート） ---
    // 矢羽を描画する汎用関数 (Step 1 の仕様を厳格維持)
    function drawArrow(ctx, x, y, length, finLength, angle, direction) {
      // 主幹（水平線）の描画
      ctx.beginPath();
      ctx.moveTo(x - length / 2, y);
      ctx.lineTo(x + length / 2, y);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1e293b';
      ctx.stroke();

      // 矢羽の角度（ラジアン）の計算
      const rad = (angle * Math.PI) / 180;

      // 左右の端点座標
      const leftX = x - length / 2;
      const rightX = x + length / 2;

      // 左側の矢羽
      ctx.beginPath();
      if (direction === -1) {
        // 内向き: 主幹の内側に羽が伸びる (→ 方向に羽)
        ctx.moveTo(leftX, y);
        ctx.lineTo(leftX + finLength * Math.cos(rad), y - finLength * Math.sin(rad));
        ctx.moveTo(leftX, y);
        ctx.lineTo(leftX + finLength * Math.cos(rad), y + finLength * Math.sin(rad));
      } else {
        // 外向き: 主幹の外側に羽が伸びる (← 方向に羽)
        ctx.moveTo(leftX, y);
        ctx.lineTo(leftX - finLength * Math.cos(rad), y - finLength * Math.sin(rad));
        ctx.moveTo(leftX, y);
        ctx.lineTo(leftX - finLength * Math.cos(rad), y + finLength * Math.sin(rad));
      }

      // 右側の矢羽
      if (direction === -1) {
        // 内向き: 主幹の内側に羽が伸びる (← 方向に羽)
        ctx.moveTo(rightX, y);
        ctx.lineTo(rightX - finLength * Math.cos(rad), y - finLength * Math.sin(rad));
        ctx.moveTo(rightX, y);
        ctx.lineTo(rightX - finLength * Math.cos(rad), y + finLength * Math.sin(rad));
      } else {
        // 外向き: 主幹の外側に羽が伸びる (→ 方向に羽)
        ctx.moveTo(rightX, y);
        ctx.lineTo(rightX + finLength * Math.cos(rad), y - finLength * Math.sin(rad));
        ctx.moveTo(rightX, y);
        ctx.lineTo(rightX + finLength * Math.cos(rad), y + finLength * Math.sin(rad));
      }
      ctx.stroke();
    }

    // 各試行の定義
    trial_list.forEach((config, index) => {
      // 比較刺激の初期長さをランダム(100〜300px)に決定
      let currentComparisonLength = Math.floor(Math.random() * (300 - 100 + 1)) + 100;
      const initialLength = currentComparisonLength; // 記録用

      // アニメーションおよび長押し操作のための状態変数
      let keysPressed = {};
      let animationFrameId = null;

      // Canvasのサイズ定義
      const canvasWidth = 700;
      const canvasHeight = 400;

      const trial = {
        type: jsPsychCanvasKeyboardResponse,
        canvas_size: [canvasHeight, canvasWidth],
        choices: [' '], // スペースキーで確定して進む
        
        // 刺激の描画関数
        stimulus: function(canvas) {
          const ctx = canvas.getContext('2d');
          
          // Canvas全体をクリア
          ctx.clearRect(0, 0, canvasWidth, canvasHeight);

          // 1. 上段：標準刺激 (内向き矢羽, 200px固定)
          // 位置: (350, 130)
          drawArrow(ctx, 350, 130, 200, config.fin_length, config.shaft_angle, -1);

          // 2. 下段：比較刺激 (外向き矢羽, 可変)
          // 位置: (350, 270)
          drawArrow(ctx, 350, 270, currentComparisonLength, config.fin_length, config.shaft_angle, 1);
        },

        // 動的なUIプロンプト。DOM生成ラグによるエラーを回避するため、ここでHTMLを安全に定義。
        prompt: function() {
          return `
            <div class="mt-4 text-center">
              <div class="text-sm font-semibold text-slate-500 mb-1">
                試行 ${index + 1} / ${trial_list.length}
              </div>
              <div class="text-lg font-medium text-slate-800 mb-3">
                上と同じ長さに見えるように、下の線の長さを調整してください。
              </div>
              <div class="flex justify-center space-x-6 text-sm text-slate-600">
                <span><kbd class="px-2 py-1 bg-slate-200 rounded border border-slate-300 shadow-sm font-mono">←</kbd> 短くする</span>
                <span><kbd class="px-2 py-1 bg-slate-200 rounded border border-slate-300 shadow-sm font-mono">→</kbd> 長くする</span>
                <span><kbd class="px-4 py-1 bg-slate-200 rounded border border-slate-300 shadow-sm font-mono">Space</kbd> 確定</span>
              </div>
            </div>
          `;
        },

        on_load: function() {
          // jsPsychが生成したCanvas要素を取得
          const canvas = document.querySelector('canvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');

          // 初期描画を確実に実行
          ctx.clearRect(0, 0, canvasWidth, canvasHeight);
          drawArrow(ctx, 350, 130, 200, config.fin_length, config.shaft_angle, -1);
          drawArrow(ctx, 350, 270, currentComparisonLength, config.fin_length, config.shaft_angle, 1);

          // 矢印キー長押し（連続調整）に対応するための更新ループ
          function updateLength() {
            let changed = false;
            const step = 1.5; // 1フレームあたりの変化ピクセル数

            if (keysPressed['ArrowLeft'] || keysPressed['Left']) {
              currentComparisonLength = Math.max(50, currentComparisonLength - step);
              changed = true;
            }
            if (keysPressed['ArrowRight'] || keysPressed['Right']) {
              currentComparisonLength = Math.min(500, currentComparisonLength + step);
              changed = true;
            }

            if (changed) {
              // 画面を再描画
              ctx.clearRect(0, 0, canvasWidth, canvasHeight);
              // 標準刺激（上）
              drawArrow(ctx, 350, 130, 200, config.fin_length, config.shaft_angle, -1);
              // 比較刺激（下）
              drawArrow(ctx, 350, 270, currentComparisonLength, config.fin_length, config.shaft_angle, 1);
            }

            // ループを継続
            animationFrameId = requestAnimationFrame(updateLength);
          }

          // キーボードイベントハンドラ
          const handleKeyDown = function(e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Left' || e.key === 'Right') {
              e.preventDefault(); // 矢印キーによるブラウザスクロールを防止
              keysPressed[e.key] = true;
            }
          };

          const handleKeyUp = function(e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Left' || e.key === 'Right') {
              keysPressed[e.key] = false;
            }
          };

          // イベントリスナーの登録
          window.addEventListener('keydown', handleKeyDown);
          window.addEventListener('keyup', handleKeyUp);

          // ループ開始
          animationFrameId = requestAnimationFrame(updateLength);

          // この試行が終了した時のクリーンアップ処理を登録
          jsPsych.getCurrentTrial().on_close = function() {
            cancelAnimationFrame(animationFrameId);
            window.removeEventListener('keydown', handleKeyDown);
            window.removeEventListener('keyup', handleKeyUp);
          };
        },

        on_finish: function(data) {
          // 独立した列として保存する構造化データ (仕様2を厳格に遵守)
          data.angle = config.shaft_angle;
          data.wing_length = config.fin_length;
          data.standard_len = 200;
          data.pse = Math.round(currentComparisonLength);
          data.error_amount = Math.round(currentComparisonLength - 200);

          // 従来の表示互換用データも格納
          data.initial_length = initialLength;
          data.adjusted_length = data.pse;
          data.illusion_amount = data.error_amount;
        }
      };

      timeline.push(trial);
    });

    // --- 3. データの自動送信画面 (新規追加) ---
    const send_data_screen = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div class="text-center p-8 bg-white rounded-2xl shadow-xl max-w-md mx-auto border border-slate-200">
          <div class="animate-spin inline-block w-10 h-10 border-[4px] border-indigo-600 border-t-transparent rounded-full mb-4"></div>
          <p class="text-xl font-bold text-slate-800 mb-2">送信中...</p>
          <p class="text-sm text-slate-500">データをGoogleスプレッドシートに保存しています。ブラウザを閉じないでください。</p>
        </div>
      `,
      choices: "NO_KEYS", // キー入力不可
      on_load: function() {
        // 反応データのみを抽出 (ID入力[survey-text]や教示[html-keyboard-response]を除外)
        const rawTrials = jsPsych.data.get().filter({trial_type: 'canvas-keyboard-response'});
        
        // 送信用のデータ構造を作成 (余分なjsPsych標準の内部変数を無視)
        const structuredPayload = rawTrials.values().map((t, idx) => {
          return {
            subject_id: t.subject_id,
            timestamp: t.timestamp,
            trial_no: idx + 1,
            angle: t.angle,
            wing_length: t.wing_length,
            standard_len: t.standard_len,
            pse: t.pse,
            error_amount: t.error_amount
          };
        });

        // GASへJSONデータとしてPOST送信
        fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(structuredPayload),
          mode: 'no-cors' // ブラウザ制限(CORS)を回避して送信を実行
        })
        .then(() => {
          console.log("Data transmission initiated");
          // 送信アニメーションを見せるため、わずかに遅延を挟んで次の完了画面へ進行
          setTimeout(() => {
            jsPsych.finishTrial();
          }, 1500);
        })
        .catch(err => {
          console.error("Data transmission failed: ", err);
          alert("自動保存に失敗しました。次の画面でデータを手動で保存してください。");
          jsPsych.finishTrial();
        });
      }
    };
    timeline.push(send_data_screen);

    // --- 4. 結果表示 & 完了報告画面 ---
    const results_screen = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function() {
        // 全試行のデータを取得
        const trials = jsPsych.data.get().filter({trial_type: 'canvas-keyboard-response'}).values();
        const studentId = jsPsych.data.get().select('subject_id').values[0] || "未登録";

        // 条件別の統計を計算するためのオブジェクト
        const summary = {};
        conditions.forEach(cond => {
          const key = `角度${cond.shaft_angle}° / 長さ${cond.fin_length}px`;
          summary[key] = { sum: 0, count: 0, values: [] };
        });

        trials.forEach(t => {
          const key = `角度${t.angle}° / 長さ${t.wing_length}px`;
          if (summary[key]) {
            summary[key].sum += t.pse;
            summary[key].count += 1;
            summary[key].values.push(t.pse);
          }
        });

        // HTML形式の結果テーブルを生成
        let tableRows = '';
        Object.keys(summary).forEach(key => {
          const avg = summary[key].count > 0 ? (summary[key].sum / summary[key].count).toFixed(1) : 0;
          const diff = (avg - 200).toFixed(1); // 基準の200pxからの差
          tableRows += `
            <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
              <td class="px-6 py-4 text-sm font-semibold text-slate-700">${key}</td>
              <td class="px-6 py-4 text-sm text-center text-slate-600">200 px</td>
              <td class="px-6 py-4 text-sm text-center font-mono text-slate-800 font-bold">${avg} px</td>
              <td class="px-6 py-4 text-sm text-center font-mono ${diff >= 0 ? 'text-rose-600' : 'text-blue-600'}">
                ${diff >= 0 ? '+' : ''}${diff} px
              </td>
            </tr>
          `;
        });

        // コピー用CSVデータの整形（指定のカラム構造で生成）
        let csvContent = "subject_id,timestamp,angle,wing_length,standard_len,pse,error_amount\\n";
        trials.forEach((t) => {
          csvContent += `${t.subject_id},"${t.timestamp}",${t.angle},${t.wing_length},${t.standard_len},${t.pse},${t.error_amount}\\n`;
        });

        return `
          <div class="text-left bg-white p-8 rounded-2xl shadow-xl border border-slate-200 max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold text-center text-emerald-600 mb-2 flex items-center justify-center gap-2">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              実験終了
            </h2>
            <div class="text-center text-sm font-mono text-slate-500 mb-6 bg-slate-50 py-1.5 px-3 rounded-lg inline-block mx-auto w-full">
              学籍番号 (subject_id): <span class="font-bold text-slate-800">${studentId}</span>
            </div>
            
            <p class="text-slate-600 text-sm mb-6 leading-relaxed">
              実験が正常に終了しました。データはスプレッドシートに自動的に送信されました。<br>
              調整後の長さが <strong>200 px（基準線の長さ）</strong> に近いほど錯視の影響が少なく、乖離が大きいほど錯視の影響を強く受けていることを意味します。一般的に、角度が鋭く、羽が長いほど錯視量が大きくなります。
            </p>

            <h3 class="text-lg font-bold text-slate-800 mb-3">条件別平均結果</h3>
            <div class="overflow-hidden rounded-xl border border-slate-200 mb-8 shadow-sm">
              <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                  <tr>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">条件 (矢羽角度 / 羽長)</th>
                    <th class="px-6 py-3 text-center text-xs font-semibold text-slate-500 uppercase tracking-wider">標準刺激(固定)</th>
                    <th class="px-6 py-3 text-center text-xs font-semibold text-slate-500 uppercase tracking-wider">調整平均値</th>
                    <th class="px-6 py-3 text-center text-xs font-semibold text-slate-500 uppercase tracking-wider">錯視量 (差分)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 bg-white">
                  ${tableRows}
                </tbody>
              </table>
            </div>

            <div class="mb-6">
              <label class="block text-sm font-bold text-slate-700 mb-2">送信済みのRAWデータ (CSV形式)</label>
              <textarea readonly class="w-full h-32 p-3 text-xs font-mono text-slate-700 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" id="csv-area">${csvContent}</textarea>
              <button onclick="copyCSV()" class="mt-2 w-full py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg text-sm font-semibold transition active:scale-95 shadow-sm">
                CSVデータをクリップボードにコピー
              </button>
            </div>

            <p class="text-xs text-center text-slate-400">
              ※予備のため、念のため上記のデータを手元に保存しておくことをお勧めします。
            </p>
          </div>
        `;
      },
      choices: ['NO_KEYS'] // 終了画面のためキー入力による進行を無効化
    };
    timeline.push(results_screen);

    // コピー処理の実装
    window.copyCSV = function() {
      const copyText = document.getElementById("csv-area");
      copyText.select();
      copyText.setSelectionRange(0, 99999); // モバイル対応
      document.execCommand("copy");
      
      // ボタンのテキストフィードバック
      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = "コピーしました！";
      btn.classList.add("bg-emerald-500", "text-white");
      btn.classList.remove("bg-slate-100", "text-slate-700");
      setTimeout(() => {
        btn.innerText = originalText;
        btn.classList.remove("bg-emerald-500", "text-white");
        btn.classList.add("bg-slate-100", "text-slate-700");
      }, 2000);
    };

    // 実験の実行
    jsPsych.run(timeline);
  </script>
</body>
</html>
