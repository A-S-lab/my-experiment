<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワーキングメモリ課題 (1-Back & 2-Back)</title>
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; }
        .jspsych-btn {
            padding: 1.25rem 2.5rem !important;
            font-size: 1.1rem !important;
            font-weight: 600 !important;
            border-radius: 9999px !important;
            transition: all 0.2s ease !important;
            border: 2px solid #4f46e5 !important;
            background: white !important;
            color: #4f46e5 !important;
        }
        .btn-active { background: #4f46e5 !important; color: white !important; transform: scale(0.95); }
        .stimulus { font-size: 100px; font-weight: 800; color: #1e293b; }
        .jspsych-content { max-width: 600px !important; }
        @media (max-width: 640px) { 
            .stimulus { font-size: 70px; } 
            .jspsych-btn { padding: 1rem 1.5rem !important; font-size: 0.9rem !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="jspsych-target" class="flex justify-center items-center min-h-screen"></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyANUmnrEzo_mpo2hK4caNPl5m2-8cXwzmZ6JWe3FSETnBkLmGr1SHyZMbd-wZPiqHBXA/exec';

        // 厳密な配列生成（1-Back/2-Back共通）
        function prepareSequence(n, total, matchCount) {
            const letters = ['A', 'B', 'C', 'D', 'E'];
            let sequence = [];
            for(let i=0; i<n; i++) sequence.push({letter: letters[Math.floor(Math.random() * letters.length)], isMatch: false});
            
            let conditions = new Array(matchCount).fill(true).concat(new Array((total - n) - matchCount).fill(false));
            conditions.sort(() => Math.random() - 0.5);

            for (let i = n; i < total; i++) {
                const isMatch = conditions[i - n];
                let nextLetter;
                if (isMatch) {
                    nextLetter = sequence[i - n].letter;
                } else {
                    let candidates = letters.filter(l => l !== sequence[i - n].letter);
                    nextLetter = candidates[Math.floor(Math.random() * candidates.length)];
                }
                sequence.push({letter: nextLetter, isMatch: isMatch});
            }
            return sequence;
        }

        const seq1Data = prepareSequence(1, 20, 6);
        const seq2Data = prepareSequence(2, 20, 6);

        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                const display = jsPsych.getDisplayElement();
                display.innerHTML = '<div class="text-center p-10"><div class="animate-pulse text-indigo-600 font-bold text-2xl">データを送信中です...</div></div>';

                const allData = jsPsych.data.get().filter({task: 'task_trial'}).values();
                const pInfo = jsPsych.data.get().filter({trial_type: 'survey-text'}).values()[0] || {response: {participant_id: 'unknown', age: 'unknown'}};
                
                const payload = allData.map(d => ({
                    participant_id: pInfo.response.participant_id,
                    age: pInfo.response.age,
                    date: new Date().toLocaleDateString('ja-JP'),
                    condition: d.condition,
                    trial_index: d.trial_index + 1,
                    stimulus: d.stimulus,
                    user_answer: d.user_answer,
                    is_match: d.is_match,
                    correct: d.correct,
                    rt: d.rt ? Math.round(d.rt) : null
                }));

                // 正しいJSON構文で送信処理を実行
                fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(() => {
                    displayFeedback();
                }).catch(() => {
                    displayFeedback(); // 失敗しても表示は行う
                });
            }
        });

        const participant_info = {
            type: jsPsychSurveyText,
            questions: [
                { prompt: '参加者ID', name: 'participant_id', required: true },
                { prompt: '年齢', name: 'age', required: true }
            ],
            button_label: '実験を開始する'
        };

        function createTrial(obj, index, condition) {
            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
                    <div class="mb-8">
                        <div class="text-slate-400 text-sm font-bold tracking-widest uppercase">${condition} | 試行 ${index + 1}</div>
                        <div class="flex justify-center gap-8 text-slate-400 text-sm mt-4">
                            <span>(F) 同じ</span> <span>(J) 違う</span>
                        </div>
                    </div>
                    <div class="stimulus my-12">${obj.letter}</div>
                `,
                choices: ['同じ', '違う'],
                stimulus_duration: 500,
                trial_duration: 2000,
                response_ends_trial: false,
                data: { task: 'task_trial', trial_index: index, stimulus: obj.letter, condition: condition, is_match: obj.isMatch },
                on_load: function() {
                    const buttons = document.querySelectorAll('.jspsych-btn');
                    const listener = function(e) {
                        if (buttons[0].disabled) return;
                        if(e.key.toLowerCase() === 'f') { buttons[0].click(); }
                        else if(e.key.toLowerCase() === 'j') { buttons[1].click(); }
                    };
                    document.addEventListener('keydown', listener);
                    
                    buttons.forEach((btn, idx) => {
                        btn.addEventListener('click', () => {
                            buttons.forEach(b => { b.disabled = true; });
                            btn.classList.add('btn-active');
                            document.removeEventListener('keydown', listener);
                        });
                    });
                },
                on_finish: function(data) {
                    if (data.response !== null) {
                        const userMatch = (data.response === 0);
                        data.correct = (userMatch === data.is_match);
                        data.user_answer = userMatch ? '同じ' : '違う';
                    } else {
                        data.correct = null;
                        data.user_answer = '-';
                    }
                }
            };
        }

        function displayFeedback() {
            const data = jsPsych.data.get().filter({task: 'task_trial'}).values();
            const getAccuracy = (cond) => {
                const d = data.filter(x => x.condition === cond);
                const answered = d.filter(x => x.correct !== null);
                return answered.length > 0 ? ((answered.filter(x => x.correct === true).length / answered.length) * 100).toFixed(1) : "0.0";
            };

            let html = `
                <div class="p-8 w-full max-w-5xl bg-white rounded-3xl shadow-xl overflow-hidden">
                    <div class="text-center font-bold text-lg text-indigo-600 mb-6">実験終了。ご協力ありがとうございました。</div>
                    <h2 class="text-3xl font-bold mb-4">実験結果</h2>
                    <div class="flex gap-6 mb-6">
                        <div class="p-4 bg-indigo-50 rounded-xl">1-Back 正答率: <b>${getAccuracy('1-back')}%</b></div>
                        <div class="p-4 bg-indigo-50 rounded-xl">2-Back 正答率: <b>${getAccuracy('2-back')}%</b></div>
                    </div>
                    <div class="max-h-[50vh] overflow-y-auto border rounded-xl">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-50 sticky top-0">
                                <tr><th class="p-3">条件</th><th class="p-3">試行</th><th class="p-3">提示</th><th class="p-3">回答</th><th class="p-3">正誤</th><th class="p-3">RT(ms)</th></tr>
                            </thead>
                            <tbody>
            `;
            data.forEach((d) => {
                const status = d.correct === null ? '-' : (d.correct ? '○' : '×');
                html += `
                    <tr class="border-b">
                        <td class="p-3">${d.condition}</td>
                        <td class="p-3">${d.trial_index + 1}</td>
                        <td class="p-3 font-bold text-lg">${d.stimulus}</td>
                        <td class="p-3">${d.user_answer}</td>
                        <td class="p-3">${status}</td>
                        <td class="p-3">${d.rt ? Math.round(d.rt) : '-'}</td>
                    </tr>
                `;
            });
            html += `</tbody></table></div></div>`;
            document.getElementById('jspsych-target').innerHTML = html;
        }

        const timeline = [participant_info, 
            { type: jsPsychInstructions, pages: ['1-Back課題：直前と同じなら「同じ」を押してください'], show_clickable_nav: true }
        ];
        seq1Data.forEach((obj, i) => timeline.push(createTrial(obj, i, '1-back')));
        
        timeline.push({ type: jsPsychHtmlButtonResponse, stimulus: '前半終了。休憩して準備ができたら2-Backへ', choices: ['2-Backを開始する'] });
        
        seq2Data.forEach((obj, i) => timeline.push(createTrial(obj, i, '2-back')));
        
        jsPsych.run(timeline);
    </script>
</body>
</html>
