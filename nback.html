<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワーキングメモリ課題 (1-Back & 2-Back)</title>
  
  <!-- jsPsych core and plugins via CDN -->
  <script src="https://unpkg.com/jspsych@7.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.0"></script>
  <link href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />

  <!-- Tailwind CSS for modern responsive UI styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* フォントと全体的なベースラインの調整 */
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
    }
    .jspsych-content {
      max-width: 800px;
      width: 100%;
    }
    /* 押しやすい大きなボタン用の共通スタイル */
    .custom-btn {
      padding: 1rem 2rem;
      font-size: 1.25rem;
      font-weight: 600;
      border-radius: 0.5rem;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    .custom-btn:active {
      transform: scale(0.98);
    }
    /* 実験中、フォーカスアウトラインを消す */
    button:focus {
      outline: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div id="jspsych-target" class="w-full max-w-2xl bg-white p-8 rounded-2xl shadow-xl border border-slate-100 flex flex-col justify-center items-center">
    <!-- jsPsych がこの中にマウントされます -->
  </div>

  <script>
    // ==========================================
    // 1. jsPsych の初期化 と 自動送信処理の統合
    // ==========================================
    const jsPsych = initJsPsych({
      display_element: 'jspsych-target',
      on_finish: function() {
        const display_element = jsPsych.getDisplayElement();
        
        // 1. 送信中の画面表示
        display_element.innerHTML = `
          <div class="text-center p-8 flex flex-col items-center justify-center min-h-[300px]">
            <svg class="animate-spin -ml-1 mr-3 h-12 w-12 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-xl font-semibold text-slate-700 animate-pulse">データを送信中です...</p>
            <p class="text-sm text-slate-400 mt-2">画面を閉じずにそのまま少々お待ちください。</p>
          </div>
        `;

        // 2. 送信用データの抽出・整形（不要な教示やアンケート行の除外）
        const allData = jsPsych.data.get();
        const trials = allData.filter({trial_type: 'html-keyboard-response'}).values();
        const taskTrials = trials.filter(t => t.condition === '1-back' || t.condition === '2-back');

        // GASへ送信するペイロード
        const payload = {
          participant_id: participantInfo.id,
          gender: participantInfo.gender,
          age: participantInfo.age,
          timestamp: new Date().toISOString(),
          trials: taskTrials.map(t => ({
            condition: t.condition,
            trial_index_custom: t.trial_index_custom,
            presented_letter: t.presented_letter,
            target_condition: t.target_condition,
            response: t.response,
            response_formatted: t.response_formatted,
            correct: t.correct,
            rt: t.rt
          }))
        };

        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxIsnQ5uslKkO47_T1NHn1LxanEilS_7gDboACfIh5-2Hx2GTU3WruaYG9JGxwvp9C9/exec';

        // 3. fetchによる送信処理 (mode: 'no-cors')
        fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        })
        .then(() => {
          // 送信成功時：完了メッセージとフィードバックを表示
          showFeedbackTable(allData, true);
        })
        .catch((error) => {
          console.error('Data transmission failed:', error);
          // ネットワークエラー時等でもデータを閲覧できるよう、完了表示してフィードバックを出す
          showFeedbackTable(allData, false);
        });
      }
    });

    // ==========================================
    // 2. 刺激生成アルゴリズム (厳格統制)
    // ==========================================
    const alphabet = ['A', 'B', 'C', 'D', 'E'];
    const totalTrials = 20;
    const targetCount = 6;

    // --- 1-Back シーケンス生成 ---
    function generate1BackSequence() {
      let sequence = [];
      let isTargetSequence = [];

      // 1試行目は必ず非ターゲット (直前が存在しないため)
      isTargetSequence.push(false);

      // 残りの19試行に対してターゲット(6個)と非ターゲット(13個)の枠を生成
      let slots = [];
      for (let i = 0; i < targetCount; i++) slots.push(true);
      for (let i = 0; i < (totalTrials - 1 - targetCount); i++) slots.push(false);

      // フィッシャー・イェーツのシャッフル
      for (let i = slots.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [slots[i], slots[j]] = [slots[j], slots[i]];
      }

      isTargetSequence = isTargetSequence.concat(slots);

      // 1試行目はランダムに決定
      let firstChar = alphabet[Math.floor(Math.random() * alphabet.length)];
      sequence.push(firstChar);

      for (let i = 1; i < totalTrials; i++) {
        let prevChar = sequence[i - 1];
        if (isTargetSequence[i]) {
          sequence.push(prevChar);
        } else {
          let available = alphabet.filter(char => char !== prevChar);
          let nextChar = available[Math.floor(Math.random() * available.length)];
          sequence.push(nextChar);
        }
      }

      console.log("1-Back Sequence:", sequence);
      console.log("1-Back Target Map:", isTargetSequence);
      return { sequence, isTargetSequence };
    }

    // --- 2-Back シーケンス生成 ---
    function generate2BackSequence() {
      let sequence = [];
      let isTargetSequence = [];

      // 1試行目と2試行目は必ず非ターゲット (2つ前が存在しないため)
      isTargetSequence.push(false, false);

      // 残りの18試行に対してターゲット(6個)と非ターゲット(12個)の枠を生成
      let slots = [];
      for (let i = 0; i < targetCount; i++) slots.push(true);
      for (let i = 0; i < (totalTrials - 2 - targetCount); i++) slots.push(false);

      // フィッシャー・イェーツのシャッフル
      for (let i = slots.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [slots[i], slots[j]] = [slots[j], slots[i]];
      }

      isTargetSequence = isTargetSequence.concat(slots);

      // 1, 2試行目の文字をランダム決定 (1つ目と2つ目は同じになっても違っても良い)
      let char1 = alphabet[Math.floor(Math.random() * alphabet.length)];
      let char2 = alphabet[Math.floor(Math.random() * alphabet.length)];
      sequence.push(char1, char2);

      for (let i = 2; i < totalTrials; i++) {
        let twoPrevChar = sequence[i - 2];
        if (isTargetSequence[i]) {
          // ターゲットの場合：2つ前の文字と同じ
          sequence.push(twoPrevChar);
        } else {
          // 非ターゲットの場合：2つ前の文字と異なる文字からランダム選択
          let available = alphabet.filter(char => char !== twoPrevChar);
          let nextChar = available[Math.floor(Math.random() * available.length)];
          sequence.push(nextChar);
        }
      }

      console.log("2-Back Sequence:", sequence);
      console.log("2-Back Target Map:", isTargetSequence);
      return { sequence, isTargetSequence };
    }

    // 刺激シーケンスの生成
    const back1Data = generate1BackSequence();
    const back2Data = generate2BackSequence();

    // ==========================================
    // 3. 参加者情報および共有変数
    // ==========================================
    let participantInfo = {
      id: '',
      gender: '',
      age: ''
    };

    // ==========================================
    // 4. タイムラインブロックの定義
    // ==========================================
    const timeline = [];

    // --- (A) 参加者情報入力画面 ---
    const participantForm = {
      type: jsPsychSurveyHtmlForm,
      html: `
        <div class="text-left w-full max-w-md mx-auto">
          <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">参加者情報の登録</h2>
          <p class="text-sm text-slate-500 mb-6 text-center">ワーキングメモリ実験へのご協力ありがとうございます。以下の項目を入力して「次へ進む」を押してください。</p>
          
          <div id="form-error-msg" class="hidden mb-4 p-3 bg-rose-50 text-rose-600 rounded-lg text-sm border border-rose-200 font-medium"></div>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="p-id">参加者ID <span class="text-rose-500">*</span></label>
              <input type="text" id="p-id" name="participant_id" placeholder="例: P001" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
            </div>
            
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="p-gender">性別 <span class="text-rose-500">*</span></label>
              <select id="p-gender" name="gender" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none bg-white">
                <option value="">選択してください</option>
                <option value="男性">男性</option>
                <option value="女性">女性</option>
                <option value="その他">その他</option>
                <option value="回答しない">回答しない</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="p-age">年齢 <span class="text-rose-500">*</span></label>
              <input type="number" id="p-age" name="age" min="0" max="120" placeholder="例: 20" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
            </div>
          </div>
        </div>
      `,
      button_label: '次へ進む',
      css_classes: ['custom-form-container'],
      on_load: function() {
        const btn = document.querySelector('#jspsych-survey-html-form-next');
        if (btn) {
          btn.className = 'custom-btn bg-indigo-600 hover:bg-indigo-700 text-white mt-8 w-full max-w-md mx-auto block';
        }
      },
      on_finish: function(data) {
        participantInfo.id = data.response.participant_id;
        participantInfo.gender = data.response.gender;
        participantInfo.age = data.response.age;

        jsPsych.data.addProperties({
          participant_id: participantInfo.id,
          gender: participantInfo.gender,
          age: participantInfo.age
        });
      },
      on_start: function(trial) {
        setTimeout(() => {
          const nextBtn = document.querySelector('#jspsych-survey-html-form-next');
          if (nextBtn) {
            nextBtn.addEventListener('click', function(e) {
              const idVal = document.getElementById('p-id').value.trim();
              const genderVal = document.getElementById('p-gender').value;
              const ageVal = document.getElementById('p-age').value.trim();
              const errorDiv = document.getElementById('form-error-msg');

              if (!idVal || !genderVal || !ageVal) {
                e.preventDefault();
                e.stopPropagation();
                errorDiv.innerText = 'すべての必須項目(*)を入力してください。';
                errorDiv.classList.remove('hidden');
              } else {
                errorDiv.classList.add('hidden');
              }
            }, true);
          }
        }, 100);
      }
    };
    timeline.push(participantForm);

    // --- (B) 1-Back用の教示（説明）画面 ---
    const instructions1Back = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="text-left leading-relaxed max-w-xl mx-auto">
          <div class="text-center mb-4">
            <span class="px-3 py-1 text-xs font-bold bg-indigo-100 text-indigo-700 rounded-full border border-indigo-200">前半セッション</span>
          </div>
          <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">1-Back 課題のルール説明</h2>
          <p class="text-lg text-slate-600 mb-4">
            このセッションでは、画面にアルファベットが1文字ずつ、順番に表示されます。
          </p>
          <div class="bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-r-lg mb-6 text-indigo-950">
            <p class="font-bold mb-1">あなたの役目：</p>
            <p>画面に文字が表示されたら、それが<strong class="text-indigo-600">「1つ前に出た文字と同じ」</strong>か、それとも<strong class="text-rose-600">「違う」</strong>かを素早く判断して回答してください。</p>
          </div>
          <p class="text-sm text-slate-500 mb-4 leading-relaxed">
            ※ 1つ目の文字のときは、比べる「前の文字」がないため、自動的に「違う」を選択してください。<br>
            ※ アルファベットは一瞬（0.5秒）だけ表示されますが、文字が消えた後も回答を受け付けています。
          </p>
          <div class="bg-slate-100 p-3 rounded-lg text-sm text-slate-600 mb-6">
            <span class="font-semibold text-slate-800">操作方法：</span><br>
            ・<strong>スマホ/タブレット:</strong> 画面下の「同じ」「違う」ボタンを直接タップ<br>
            ・<strong>PC:</strong> キーボードの <kbd class="px-2 py-0.5 bg-white border border-slate-300 rounded shadow-sm font-mono font-bold">F</kbd> キーで「同じ」、<kbd class="px-2 py-0.5 bg-white border border-slate-300 rounded shadow-sm font-mono font-bold">J</kbd> キーで「違う」を入力可能
          </div>
        </div>
      `,
      choices: ['準備ができたら始める'],
      button_html: '<button class="custom-btn bg-indigo-600 hover:bg-indigo-700 text-white w-full sm:w-auto">%choice%</button>',
      css_classes: ['flex', 'flex-col', 'items-center']
    };
    timeline.push(instructions1Back);

    // --- 1-Back 開始カウントダウン ---
    const countdown1 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div class="text-6xl font-bold text-slate-300">1-Back 開始</div>',
      trial_duration: 1200,
      response_ends_trial: false
    };
    timeline.push(countdown1);

    // --- 1-Back 課題試行ループ ---
    for (let i = 0; i < totalTrials; i++) {
      const currentLetter = back1Data.sequence[i];
      const isTarget = back1Data.isTargetSequence[i];

      const trial1Back = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
          return `
            <div class="w-full flex flex-col justify-between items-center h-96 relative">
              <div class="text-slate-400 font-medium text-sm select-none text-center">
                <span class="font-bold text-indigo-600 mr-2">[前半: 1-Back]</span> 1つ前の文字と: 
                <span class="text-indigo-500 font-semibold bg-indigo-50 px-2 py-1 rounded">F キー ＝ 同じ</span>
                <span class="text-rose-500 font-semibold bg-rose-50 px-2 py-1 rounded ml-2">J キー ＝ 違う</span>
              </div>

              <!-- 巨大な文字 (刺激) -->
              <div id="stimulus-letter" class="text-9xl font-extrabold tracking-wider text-slate-800 my-auto select-none transition-opacity duration-150">
                ${currentLetter}
              </div>

              <!-- タッチ対応用の仮想ボタン -->
              <div class="w-full flex justify-center gap-6 mt-8">
                <button id="touch-btn-same" onclick="simulateKeyPress('f')" class="flex-1 max-w-xs py-4 px-6 bg-slate-100 hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-300 text-slate-700 hover:text-indigo-700 text-xl font-bold rounded-xl active:scale-95 transition-all shadow-sm">
                  同じ (F)
                </button>
                <button id="touch-btn-diff" onclick="simulateKeyPress('j')" class="flex-1 max-w-xs py-4 px-6 bg-slate-100 hover:bg-rose-50 border-2 border-slate-200 hover:border-rose-300 text-slate-700 hover:text-rose-700 text-xl font-bold rounded-xl active:scale-95 transition-all shadow-sm">
                  違う (J)
                </button>
              </div>
            </div>
          `;
        },
        choices: ['f', 'j'],
        trial_duration: 2000, // 2秒間固定
        response_ends_trial: false, // キー入力で次の試行に進ませない

        on_load: function() {
          // 500ms後に刺激文字を非表示化
          setTimeout(() => {
            const letterEl = document.getElementById('stimulus-letter');
            if (letterEl) {
              letterEl.style.opacity = '0';
              letterEl.innerText = '';
            }
          }, 500);

          window.lastPressedKey = null;
        },

        on_finish: function(data) {
          const correctKey = isTarget ? 'f' : 'j';
          const pResponse = data.response;
          let correct = (pResponse === correctKey);

          // メタデータの詳細記録
          data.condition = '1-back';
          data.trial_index_custom = i + 1;
          data.presented_letter = currentLetter;
          data.target_condition = isTarget ? '同じ' : '違う';
          data.correct = correct;
          data.response_formatted = pResponse === 'f' ? '同じ (F)' : (pResponse === 'j' ? '違う (J)' : '無反応');
        }
      };
      timeline.push(trial1Back);
    }

    // --- (C) 休憩 ＆ 2-Back用の教示（説明）画面 ---
    const instructions2Back = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="text-left leading-relaxed max-w-xl mx-auto">
          <div class="text-center mb-4">
            <span class="px-3 py-1 text-xs font-bold bg-amber-100 text-amber-700 rounded-full border border-amber-200">後半セッション</span>
          </div>
          <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">少し休憩してください ＆ ルール変更</h2>
          
          <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg mb-6 text-amber-950">
            <p class="font-bold mb-2 text-lg">💡 ここからルールが変わります！</p>
            <p class="mb-2">これからは、表示された文字が<strong class="text-indigo-600">「2つ前に出た文字と同じ」</strong>か、それとも<strong class="text-rose-600">「違う」</strong>かを判断してください。</p>
            <p class="text-sm text-amber-800 font-semibold">※ 1つ前ではなく、「2つ前の文字」と比較します。</p>
          </div>

          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
            <p class="font-bold text-slate-700 mb-2">例：【 A → B → A 】と出た場合</p>
            <p class="text-sm text-slate-600">
              ・1つ目「A」：比べるものがないので <strong>違う (J)</strong><br>
              ・2つ目「B」：比べるもの(2つ前)がないので <strong>違う (J)</strong><br>
              ・3つ目「A」：2つ前の「A」と同じなので <strong class="text-indigo-600">同じ (F) [ターゲット]</strong>
            </p>
          </div>

          <p class="text-sm text-slate-500 mb-4 leading-relaxed">
            ※ 最初の2試行は、比べる「2つ前の文字」がないため、自動的に「違う」を選択してください。
          </p>
          <div class="bg-slate-100 p-3 rounded-lg text-sm text-slate-600 mb-6">
            <span class="font-semibold text-slate-800">操作方法（同様）：</span><br>
            ・<strong>スマホ/タブレット:</strong> 画面下の「同じ」「違う」ボタンをタップ<br>
            ・<strong>PC:</strong> キーボードの <kbd class="px-2 py-0.5 bg-white border border-slate-300 rounded shadow-sm font-mono font-bold">F</kbd>（同じ）、<kbd class="px-2 py-0.5 bg-white border border-slate-300 rounded shadow-sm font-mono font-bold">J</kbd>（違う）
          </div>
        </div>
      `,
      choices: ['理解したので2-Backを開始する'],
      button_html: '<button class="custom-btn bg-indigo-600 hover:bg-indigo-700 text-white w-full sm:w-auto">%choice%</button>',
      css_classes: ['flex', 'flex-col', 'items-center']
    };
    timeline.push(instructions2Back);

    // --- 2-Back 開始カウントダウン ---
    const countdown2 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div class="text-6xl font-bold text-slate-300">2-Back 開始</div>',
      trial_duration: 1200,
      response_ends_trial: false
    };
    timeline.push(countdown2);

    // --- 2-Back 課題試行ループ ---
    for (let i = 0; i < totalTrials; i++) {
      const currentLetter = back2Data.sequence[i];
      const isTarget = back2Data.isTargetSequence[i];

      const trial2Back = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
          return `
            <div class="w-full flex flex-col justify-between items-center h-96 relative">
              <div class="text-slate-400 font-medium text-sm select-none text-center">
                <span class="font-bold text-amber-600 mr-2">[後半: 2-Back]</span> 2つ前の文字と: 
                <span class="text-indigo-500 font-semibold bg-indigo-50 px-2 py-1 rounded">F キー ＝ 同じ</span>
                <span class="text-rose-500 font-semibold bg-rose-50 px-2 py-1 rounded ml-2">J キー ＝ 違う</span>
              </div>

              <!-- 巨大な文字 (刺激) -->
              <div id="stimulus-letter" class="text-9xl font-extrabold tracking-wider text-slate-800 my-auto select-none transition-opacity duration-150">
                ${currentLetter}
              </div>

              <!-- タッチ対応用の仮想ボタン -->
              <div class="w-full flex justify-center gap-6 mt-8">
                <button id="touch-btn-same" onclick="simulateKeyPress('f')" class="flex-1 max-w-xs py-4 px-6 bg-slate-100 hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-300 text-slate-700 hover:text-indigo-700 text-xl font-bold rounded-xl active:scale-95 transition-all shadow-sm">
                  同じ (F)
                </button>
                <button id="touch-btn-diff" onclick="simulateKeyPress('j')" class="flex-1 max-w-xs py-4 px-6 bg-slate-100 hover:bg-rose-50 border-2 border-slate-200 hover:border-rose-300 text-slate-700 hover:text-rose-700 text-xl font-bold rounded-xl active:scale-95 transition-all shadow-sm">
                  違う (J)
                </button>
              </div>
            </div>
          `;
        },
        choices: ['f', 'j'],
        trial_duration: 2000,
        response_ends_trial: false,

        on_load: function() {
          setTimeout(() => {
            const letterEl = document.getElementById('stimulus-letter');
            if (letterEl) {
              letterEl.style.opacity = '0';
              letterEl.innerText = '';
            }
          }, 500);

          window.lastPressedKey = null;
        },

        on_finish: function(data) {
          const correctKey = isTarget ? 'f' : 'j';
          const pResponse = data.response;
          let correct = (pResponse === correctKey);

          // メタデータの詳細記録
          data.condition = '2-back';
          data.trial_index_custom = i + 1;
          data.presented_letter = currentLetter;
          data.target_condition = isTarget ? '同じ' : '違う';
          data.correct = correct;
          data.response_formatted = pResponse === 'f' ? '同じ (F)' : (pResponse === 'j' ? '違う (J)' : '無反応');
        }
      };
      timeline.push(trial2Back);
    }

    // ==========================================
    // 5. タッチ用ボタンが押された時のブリッジ処理
    // ==========================================
    function simulateKeyPress(key) {
      if (window.lastPressedKey) return;
      window.lastPressedKey = key;

      const sameBtn = document.getElementById('touch-btn-same');
      const diffBtn = document.getElementById('touch-btn-diff');
      
      if (key === 'f' && sameBtn) {
        sameBtn.classList.remove('bg-slate-100', 'border-slate-200');
        sameBtn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
      } else if (key === 'j' && diffBtn) {
        diffBtn.classList.remove('bg-slate-100', 'border-slate-200');
        diffBtn.classList.add('bg-rose-600', 'text-white', 'border-rose-600');
      }

      const keyboardEvent = new KeyboardEvent('keydown', {
        key: key,
        code: key === 'f' ? 'KeyF' : 'KeyJ',
        keyCode: key === 'f' ? 70 : 74,
        which: key === 'f' ? 70 : 74,
        bubbles: true
      });
      document.dispatchEvent(keyboardEvent);
    }

    // ==========================================
    // 6. 実験の開始
    // ==========================================
    jsPsych.run(timeline);

    // ==========================================
    // 7. フィードバック表の構築と表示 (実験終了後)
    // ==========================================
    function showFeedbackTable(jspsychData, isSendSuccess) {
      // keyboard-responseプラグインの全試行を抽出
      const trials = jspsychData.filter({trial_type: 'html-keyboard-response'}).values();
      
      // カウントダウン表示等を除外し、1-Backと2-Backのタスク試行のみを統合
      const taskTrials = trials.filter(t => t.condition === '1-back' || t.condition === '2-back');

      const targetDiv = jsPsych.getDisplayElement();
      targetDiv.innerHTML = '';
      targetDiv.className = 'w-full max-w-4xl bg-white p-8 rounded-2xl shadow-xl border border-slate-100 flex flex-col justify-center';

      // 1-Back / 2-Back 別の統計値算出
      const back1Trials = taskTrials.filter(t => t.condition === '1-back');
      const back2Trials = taskTrials.filter(t => t.condition === '2-back');

      // 1-Back 統計
      const b1Correct = back1Trials.filter(t => t.correct).length;
      const b1Accuracy = ((b1Correct / back1Trials.length) * 100).toFixed(1);
      const b1RTs = back1Trials.filter(t => t.rt !== null).map(t => t.rt);
      const b1AvgRT = b1RTs.length > 0 ? (b1RTs.reduce((a, b) => a + b, 0) / b1RTs.length).toFixed(0) : '-';

      // 2-Back 統計
      const b2Correct = back2Trials.filter(t => t.correct).length;
      const b2Accuracy = ((b2Correct / back2Trials.length) * 100).toFixed(1);
      const b2RTs = back2Trials.filter(t => t.rt !== null).map(t => t.rt);
      const b2AvgRT = b2RTs.length > 0 ? (b2RTs.reduce((a, b) => a + b, 0) / b2RTs.length).toFixed(0) : '-';

      // 送信結果通知メッセージ
      let transmissionStatusHtml = '';
      if (isSendSuccess) {
        transmissionStatusHtml = `
          <div class="mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-center font-medium shadow-sm">
            ✨ 実験終了。ご協力ありがとうございました。<br>
            <span class="text-sm font-normal text-emerald-600">データは正常に保存されました。</span>
          </div>
        `;
      } else {
        transmissionStatusHtml = `
          <div class="mb-6 p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-center font-medium shadow-sm">
            ⚠️ 実験終了。ご協力ありがとうございました。<br>
            <span class="text-sm font-normal text-amber-600">データの自動送信に失敗したか、もしくはオフライン環境です。</span>
          </div>
        `;
      }

      let html = `
        ${transmissionStatusHtml}

        <div class="mb-8 text-center">
          <span class="inline-block px-3 py-1 text-xs font-bold bg-green-50 text-green-700 rounded-full mb-2 border border-green-200">実験終了</span>
          <h2 class="text-3xl font-bold text-slate-800">ワーキングメモリ課題 結果レポート</h2>
          <p class="text-slate-500 mt-2">ご協力ありがとうございました。1-Backと2-Backの比較データが正常に記録されました。</p>
        </div>

        <!-- 参加者基本情報 -->
        <div class="mb-6 p-4 bg-slate-50 rounded-xl border border-slate-100 flex flex-wrap justify-around items-center gap-4 text-center">
          <div>
            <span class="text-xs text-slate-400 font-semibold block uppercase">参加者 ID</span>
            <span class="text-lg font-bold text-slate-700">${participantInfo.id || 'N/A'}</span>
          </div>
          <div>
            <span class="text-xs text-slate-400 font-semibold block uppercase">デモグラフィック</span>
            <span class="text-lg font-bold text-slate-700">${participantInfo.gender} / ${participantInfo.age}歳</span>
          </div>
        </div>

        <!-- 比較統計サマリーカード -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <!-- 1-Backサマリー -->
          <div class="p-5 rounded-2xl bg-indigo-50/50 border border-indigo-100 flex flex-col justify-between">
            <div>
              <span class="inline-block px-2 py-0.5 text-xs font-bold bg-indigo-100 text-indigo-700 rounded mb-2">前半: 1-Back</span>
              <div class="flex justify-between items-baseline mt-2">
                <span class="text-slate-500 text-sm">正答率:</span>
                <span class="text-2xl font-extrabold text-indigo-600">${b1Accuracy}% <span class="text-xs font-normal text-slate-400">(${b1Correct}/${back1Trials.length})</span></span>
              </div>
              <div class="flex justify-between items-baseline mt-1">
                <span class="text-slate-500 text-sm">平均反応時間:</span>
                <span class="text-xl font-bold text-slate-700">${b1AvgRT} <span class="text-xs font-normal text-slate-400">ms</span></span>
              </div>
            </div>
          </div>

          <!-- 2-Backサマリー -->
          <div class="p-5 rounded-2xl bg-amber-50/50 border border-amber-100 flex flex-col justify-between">
            <div>
              <span class="inline-block px-2 py-0.5 text-xs font-bold bg-amber-100 text-amber-700 rounded mb-2">後半: 2-Back</span>
              <div class="flex justify-between items-baseline mt-2">
                <span class="text-slate-500 text-sm">正答率:</span>
                <span class="text-2xl font-extrabold text-amber-600">${b2Accuracy}% <span class="text-xs font-normal text-slate-400">(${b2Correct}/${back2Trials.length})</span></span>
              </div>
              <div class="flex justify-between items-baseline mt-1">
                <span class="text-slate-500 text-sm">平均反応時間:</span>
                <span class="text-xl font-bold text-slate-700">${b2AvgRT} <span class="text-xs font-normal text-slate-400">ms</span></span>
              </div>
            </div>
          </div>
        </div>

        <!-- 詳細結果テーブル -->
        <div class="overflow-x-auto rounded-xl border border-slate-200">
          <table class="w-full text-left border-collapse bg-white">
            <thead>
              <tr class="bg-slate-50 text-slate-600 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
                <th class="py-3 px-4">条件</th>
                <th class="py-3 px-4">試行番号</th>
                <th class="py-3 px-4">提示文字</th>
                <th class="py-3 px-4">ターゲット条件</th>
                <th class="py-3 px-4">参加者の回答</th>
                <th class="py-3 px-4">正誤 (Correct)</th>
                <th class="py-3 px-4">反応時間 (RT)</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm text-slate-700">
      `;

      taskTrials.forEach((t, index) => {
        const rowClass = t.correct ? 'hover:bg-green-50/20' : 'bg-rose-50/5 hover:bg-rose-50/20';
        
        // 条件別のバッジ
        const condBadge = t.condition === '1-back' 
          ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100">1-Back</span>`
          : `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-100">2-Back</span>`;

        const correctBadge = t.correct 
          ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-green-50 text-green-700 border border-green-200">正解</span>`
          : `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">不正解</span>`;
        
        const isTargetBadge = t.target_condition === '同じ'
          ? `<span class="text-indigo-600 font-semibold bg-indigo-50/50 px-1.5 py-0.5 rounded text-xs">${t.target_condition}</span>`
          : `<span class="text-slate-400 font-normal">${t.target_condition}</span>`;

        html += `
          <tr class="${rowClass} transition-colors">
            <td class="py-3 px-4">${condBadge}</td>
            <td class="py-3 px-4 font-mono font-medium text-slate-500">${t.trial_index_custom}</td>
            <td class="py-3 px-4 font-bold text-slate-900">${t.presented_letter}</td>
            <td class="py-3 px-4">${isTargetBadge}</td>
            <td class="py-3 px-4 font-medium">${t.response_formatted}</td>
            <td class="py-3 px-4">${correctBadge}</td>
            <td class="py-3 px-4 font-mono">${t.rt !== null ? `${t.rt.toFixed(0)} ms` : '<span class="text-rose-400 font-semibold">時間切れ</span>'}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>

        <div class="mt-6 flex justify-center">
          <button onclick="window.location.reload();" class="custom-btn bg-slate-800 hover:bg-slate-900 text-white flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" />
            </svg>
            最初からやり直す
          </button>
        </div>
      `;

      targetDiv.innerHTML = html;
    }
  </script>
</body>
</html>
