<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワーキングメモリ課題 (1-Back & 2-Back)</title>
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; }
        
        .jspsych-btn {
            padding: 1.25rem 2.5rem !important;
            font-size: 1.1rem !important;
            font-weight: 600 !important;
            border-radius: 9999px !important;
            transition: none !important; 
            border: 2px solid #4f46e5 !important;
            background: white !important;
            color: #4f46e5 !important;
            outline: none !important;
        }
        .jspsych-btn:active { transform: none !important; background: #e0e7ff !important; }
        
        .stimulus { font-size: 100px; font-weight: 800; color: #1e293b; }
        .jspsych-content { max-width: 600px !important; }
        
        @media (max-width: 640px) { 
            .stimulus { font-size: 70px; } 
            .jspsych-btn { padding: 1rem 1.5rem !important; font-size: 0.9rem !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="jspsych-target" class="flex justify-center items-center min-h-screen"></div>

    <script>
        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                // 送信中メッセージ表示
                document.getElementById('jspsych-target').innerHTML = `
                    <div class="text-center p-10 bg-white rounded-3xl shadow-xl">
                        <div class="text-2xl font-bold mb-4">データを送信中です...</div>
                    </div>
                `;

                // データ送信
                const data = jsPsych.data.get().filter({task: 'task_trial'}).values();
                const GAS_URL = 'https://script.google.com/macros/s/AKfycbz1NUdnuIk_IIxreQdpPrauaTBcUjTt3kk9oaRgxo2hdyQKNAZKZa7GMrIEUIip_ETpkw/exec';
                
                fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).finally(() => {
                    displayFeedback(true); // 送信完了メッセージ付きで表示
                });
            }
        });

        function generateSequence(n, total, matchCount) {
            const letters = ['A', 'B', 'C', 'D', 'E'];
            let sequence = [];
            for(let i=0; i<n; i++) sequence.push(letters[Math.floor(Math.random() * letters.length)]);
            let conditions = new Array(matchCount).fill('match').concat(new Array((total - n) - matchCount).fill('mismatch'));
            conditions.sort(() => Math.random() - 0.5);
            for (let i = n; i < total; i++) {
                if (conditions[i - n] === 'match') {
                    sequence.push(sequence[i - n]);
                } else {
                    let candidates = letters.filter(l => l !== sequence[i - n]);
                    sequence.push(candidates[Math.floor(Math.random() * candidates.length)]);
                }
            }
            return sequence;
        }

        const participant_info = {
            type: jsPsychSurveyText,
            questions: [
                { prompt: '参加者ID', name: 'participant_id', required: true },
                { prompt: '年齢', name: 'age', required: true }
            ],
            button_label: '実験を開始する'
        };

        function createTrial(letter, index, isMatch, condition) {
            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
                    <div class="mb-8">
                        <div class="text-slate-400 text-sm font-bold tracking-widest uppercase">${condition} | 試行 ${index + 1}</div>
                        <div class="flex justify-center gap-8 text-slate-400 text-sm mt-4">
                            <span>(F) 同じ</span> <span>(J) 違う</span>
                        </div>
                    </div>
                    <div class="stimulus my-12">${letter}</div>
                `,
                choices: ['同じ', '違う'],
                stimulus_duration: 500,
                trial_duration: 2000,
                response_ends_trial: false,
                data: { task: 'task_trial', trial_index: index, stimulus: letter, condition: condition, is_match: isMatch },
                on_load: function() {
                    const listener = function(e) {
                        if(e.key.toLowerCase() === 'f') { jsPsych.finishTrial({response: 0}); }
                        else if(e.key.toLowerCase() === 'j') { jsPsych.finishTrial({response: 1}); }
                    };
                    document.addEventListener('keydown', listener, {once: true});
                },
                on_finish: function(data) {
                    const userMatch = (data.response === 0);
                    data.correct = (userMatch === isMatch);
                }
            };
        }

        function displayFeedback(isSent = false) {
            const data = jsPsych.data.get().filter({task: 'task_trial'}).values();
            const getAccuracy = (cond) => {
                const d = data.filter(x => x.condition === cond);
                return d.length > 0 ? ((d.filter(x => x.correct).length / d.length) * 100).toFixed(1) : "0.0";
            };

            let html = `
                <div class="p-8 w-full max-w-5xl bg-white rounded-3xl shadow-xl overflow-hidden">
                    ${isSent ? '<div class="text-center font-bold text-lg text-indigo-600 mb-6">実験終了。ご協力ありがとうございました。</div>' : ''}
                    <h2 class="text-3xl font-bold mb-4">実験結果</h2>
                    <div class="flex gap-6 mb-6">
                        <div class="p-4 bg-indigo-50 rounded-xl">1-Back 正答率: <b>${getAccuracy('1-back')}%</b></div>
                        <div class="p-4 bg-indigo-50 rounded-xl">2-Back 正答率: <b>${getAccuracy('2-back')}%</b></div>
                    </div>
                    <div class="max-h-[50vh] overflow-y-auto border rounded-xl">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-50 sticky top-0">
                                <tr><th class="p-3">条件</th><th class="p-3">試行</th><th class="p-3">文字</th><th class="p-3">正誤</th><th class="p-3">反応時間(ms)</th></tr>
                            </thead>
                            <tbody>
            `;
            data.forEach((d) => {
                html += `
                    <tr class="border-b">
                        <td class="p-3">${d.condition}</td>
                        <td class="p-3">${d.trial_index + 1}</td>
                        <td class="p-3 font-bold text-lg">${d.stimulus}</td>
                        <td class="p-3">${d.correct ? '○' : '×'}</td>
                        <td class="p-3">${d.rt ? Math.round(d.rt) : '-'}</td>
                    </tr>
                `;
            });
            html += `</tbody></table></div><div class="mt-8 text-center"><button onclick="location.reload()" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold">最初からやり直す</button></div></div>`;
            document.getElementById('jspsych-target').innerHTML = html;
        }

        const timeline = [participant_info, 
            { type: jsPsychInstructions, pages: ['1-Back課題：直前と同じなら「同じ」を押してください'], show_clickable_nav: true }
        ];
        
        generateSequence(1, 20, 6).forEach((l, i) => timeline.push(createTrial(l, i, (i>0 && l===generateSequence(1,20,6)[i-1]), '1-back')));
        
        timeline.push({ type: jsPsychHtmlButtonResponse, stimulus: '前半終了。休憩して準備ができたら2-Backへ', choices: ['2-Backを開始する'] });
        
        generateSequence(2, 20, 6).forEach((l, i) => timeline.push(createTrial(l, i, (i>1 && l===generateSequence(2,20,6)[i-2]), '2-back')));
        
        jsPsych.run(timeline);
    </script>
</body>
</html>
