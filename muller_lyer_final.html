<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ミュラー・リヤー錯視実験 (Müller-Lyer Illusion)</title>
  
  <!-- jsPsych core and plugins via CDN -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-canvas-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

  <!-- Tailwind CSS for elegant design -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for beautiful live data analysis -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* 画面全体で安全にスクロールできるように設計 */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      color: #0f172a;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      line-height: 1.6;
      overflow-y: auto; /* 縦スクロールを常に可能に */
      overflow-x: hidden; /* 全体的な横揺れを防止 */
      -webkit-overflow-scrolling: touch; /* iOSでの慣性スクロールを有効化 */
    }
    
    /* コンテンツが小さい時は中央、はみ出す時は上詰めでスクロール可能にする設計 */
    .jspsych-content-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start; /* 上詰めで開始、margin: auto で中央寄せ */
      min-height: 100vh;
      width: 100%;
      padding: 1.5rem 1rem 5rem 1rem; /* 下部にスマホのセーフエリア用の十分な余白を設定 */
      box-sizing: border-box;
    }
    
    .jspsych-content {
      max-width: 850px;
      width: 100%;
      background: transparent;
      margin-top: auto;
      margin-bottom: auto; /* 上下中央寄せを維持しつつ、溢れたときはスクロール可能に */
    }

    /* キャンバスの美化とレスポンシブ化 */
    canvas {
      border: 2px solid #e2e8f0;
      border-radius: 1rem;
      background-color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* 入力フォームのモダン化 */
    .jspsych-survey-text-question input[type="text"] {
      width: 100% !important;
      max-width: 360px;
      margin: 1.25rem auto !important;
      padding: 0.875rem 1.25rem !important;
      border: 2px solid #cbd5e1 !important;
      border-radius: 0.75rem !important;
      font-size: 1.1rem !important;
      text-align: center;
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.03);
      transition: all 0.2s ease-in-out;
    }
    .jspsych-survey-text-question input[type="text"]:focus {
      outline: none;
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15) !important;
    }

    /* ボタンのスマホ最適化（タップターゲット拡大と十分な下部余白） */
    .jspsych-btn {
      background-color: #4f46e5 !important;
      border-radius: 0.75rem !important;
      padding: 1rem 2.5rem !important; /* スマホでタップしやすいように高さを確保 */
      font-weight: 700 !important;
      font-size: 1.05rem !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25) !important;
      color: white !important;
      border: none !important;
      touch-action: manipulation; /* ダブルタップズームによるクリック遅延を防止 */
    }
    .jspsych-btn:hover {
      background-color: #4338ca !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35) !important;
    }
    .jspsych-btn:active {
      transform: translateY(1px);
    }

    /* 高級感のあるカスタムスライダー */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 12px; /* 少し太くしてタッチ操作をしやすく */
      background: #e2e8f0;
      border-radius: 9999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 32px; /* スマホで掴みやすいようにサイズを拡大 */
      height: 32px;
      border-radius: 50%;
      background: #4f46e5;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(79, 70, 229, 0.4);
      transition: background-color 0.15s, transform 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      background: #4338ca;
      transform: scale(1.1);
    }
    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>

  <script>
    // --- 送信先GASウェブアプリのURL設定 ---
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxCYz1C4JScfHwmKlLArA4w1BkhJRHee3GNeh12w0U0Cq8FPER_bhl4CrhVJQhoGKEe9g/exec';

    // jsPsychの初期化
    const jsPsych = initJsPsych({
      display_element: 'jspsych-target'
    });

    // 実験パラメータの定義
    const conditions = [
      { shaft_angle: 15, fin_length: 20 },
      { shaft_angle: 15, fin_length: 50 },
      { shaft_angle: 75, fin_length: 20 },
      { shaft_angle: 75, fin_length: 50 }
    ];

    // 試行回数の設定 (4条件 × 3回 = 12試行)
    const repetitions = 3;
    let trial_list = [];
    for (let i = 0; i < repetitions; i++) {
      trial_list = trial_list.concat(JSON.parse(JSON.stringify(conditions)));
    }
    // シャッフル
    trial_list = jsPsych.randomization.shuffle(trial_list);

    // タイムラインの配列
    const timeline = [];

    // --- STREAMING_CHUNK: Defining arrow drawing function... ---
    // 矢羽を描画する汎用関数
    function drawArrow(ctx, x, y, length, finLength, angle, direction) {
      // 主幹（水平線）の描画
      ctx.beginPath();
      ctx.moveTo(x - length / 2, y);
      ctx.lineTo(x + length / 2, y);
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#1e293b';
      ctx.lineCap = 'round';
      ctx.stroke();

      // 矢羽の角度（ラジアン）の計算
      const rad = (angle * Math.PI) / 180;

      // 左右 of 端点座標
      const leftX = x - length / 2;
      const rightX = x + length / 2;

      ctx.beginPath();
      ctx.lineWidth = 3.5;
      ctx.lineJoin = 'round';

      // 左側の矢羽
      if (direction === -1) {
        // 内向き: 主幹の内側に羽が伸びる (→ 方向に羽)
        ctx.moveTo(leftX, y);
        ctx.lineTo(leftX + finLength * Math.cos(rad), y - finLength * Math.sin(rad));
        ctx.moveTo(leftX, y);
        ctx.lineTo(leftX + finLength * Math.cos(rad), y + finLength * Math.sin(rad));
      } else {
        // 外向き: 主幹の外側に羽が伸びる (← 方向に羽)
        ctx.moveTo(leftX, y);
        ctx.lineTo(leftX - finLength * Math.cos(rad), y - finLength * Math.sin(rad));
        ctx.moveTo(leftX, y);
        ctx.lineTo(leftX - finLength * Math.cos(rad), y + finLength * Math.sin(rad));
      }

      // 右側の矢羽
      if (direction === -1) {
        // 内向き: 主幹の内側に羽が伸びる (← 方向に羽)
        ctx.moveTo(rightX, y);
        ctx.lineTo(rightX - finLength * Math.cos(rad), y - finLength * Math.sin(rad));
        ctx.moveTo(rightX, y);
        ctx.lineTo(rightX - finLength * Math.cos(rad), y + finLength * Math.sin(rad));
      } else {
        // 外向き: 主幹の外側に羽が伸びる (→ 方向に羽)
        ctx.moveTo(rightX, y);
        ctx.lineTo(rightX + finLength * Math.cos(rad), y - finLength * Math.sin(rad));
        ctx.moveTo(rightX, y);
        ctx.lineTo(rightX + finLength * Math.cos(rad), y + finLength * Math.sin(rad));
      }
      ctx.stroke();
    }

    // --- STREAMING_CHUNK: Creating ID input screen... ---
    // --- 0. 学籍番号（参加者ID）入力画面 ---
    const id_input_screen = {
      type: jsPsychSurveyText,
      questions: [
        { 
          prompt: `
            <div class="text-center mb-2 px-2">
              <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-3 tracking-tight">心理学実験システム</h1>
              <p class="text-sm sm:text-base text-slate-500 max-w-md mx-auto">データを正確に記録するため、学籍番号（または参加者用ID）を入力してください。</p>
            </div>
          `, 
          placeholder: "例: 2026X1234",
          name: 'student_id', 
          required: true 
        }
      ],
      button_label: '次へ進む',
      button_html: `<button class="jspsych-btn mt-6 mb-12 px-8 py-4 text-base font-bold text-white bg-indigo-600 rounded-xl shadow-lg hover:bg-indigo-700 transition">%choice%</button>`,
      on_finish: function(data) {
        jsPsych.data.addProperties({
          subject_id: data.response.student_id,
          timestamp: new Date().toLocaleString('ja-JP')
        });
      }
    };
    timeline.push(id_input_screen);

    // --- STREAMING_CHUNK: Creating instructions screen... ---
    // --- 1. インストラクション (教示画面) ---
    const instructions = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="text-left max-w-xl mx-auto bg-white p-5 sm:p-8 rounded-2xl shadow-xl border border-slate-100 my-2">
          <h1 class="text-xl sm:text-2xl font-extrabold text-center text-indigo-700 mb-5 flex items-center justify-center gap-2">
            <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            ミュラー・リヤー錯視実験
          </h1>
          
          <div class="space-y-4 text-slate-600 text-sm sm:text-base leading-relaxed">
            <p class="font-bold text-center text-slate-800 mb-4 text-base sm:text-lg">
              ご協力ありがとうございます。<br>目の錯覚に関する実験を開始します。
            </p>
            
            <p>
              画面に２つの<strong>「矢印のような図形」</strong>が上下に並んで表示されます。
            </p>

            <ul class="list-none pl-1 space-y-3">
              <li class="flex items-start gap-2">
                <span class="inline-flex items-center justify-center bg-indigo-100 text-indigo-700 font-bold rounded-full w-5 h-5 text-xs mt-1 shrink-0">上</span>
                <div><strong>上の図形 (標準刺激)</strong>：長さは変化しません。</div>
              </li>
              <li class="flex items-start gap-2">
                <span class="inline-flex items-center justify-center bg-emerald-100 text-emerald-700 font-bold rounded-full w-5 h-5 text-xs mt-1 shrink-0">下</span>
                <div><strong>下の図形 (比較刺激)</strong>：スライダーを左右に動かすと、長さが変わります。</div>
              </li>
            </ul>

            <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl text-indigo-900 font-medium text-xs sm:text-sm text-center shadow-inner mt-4">
              下のつまみを動かして、<strong class="text-indigo-600">「上の横線」と「下の横線」が完全に同じ長さ</strong>に見えるところで、画面下の決定ボタンを押してください。
            </div>
          </div>
        </div>
      `,
      choices: ['実験を開始する'],
      // mb-12 にてスマホ底部でのタップ障害を完全に防止
      button_html: `<button class="jspsych-btn mt-6 mb-12 w-full py-4 text-base sm:text-lg font-bold text-white bg-indigo-600 rounded-xl shadow-lg hover:bg-indigo-700 transition">%choice%</button>`
    };
    timeline.push(instructions);

    // --- STREAMING_CHUNK: Setting up experimental trials... ---
    // --- 2. 実験試行 ---
    trial_list.forEach((config, index) => {
      let currentComparisonLength = Math.floor(Math.random() * (300 - 100 + 1)) + 100;
      const initialLength = currentComparisonLength; // 記録用

      const canvasWidth = 700;
      const canvasHeight = 400;

      const trial = {
        type: jsPsychHtmlButtonResponse,
        stimulus: function() {
          return `
            <div class="text-center w-full flex flex-col items-center px-1">
              <!-- 進行状況を示すカウンター -->
              <div class="flex items-center gap-2 text-xs sm:text-sm font-semibold text-slate-500 mb-3 bg-white px-4 py-1.5 rounded-full shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 animate-pulse"></span>
                試行 ${index + 1} / ${trial_list.length}
              </div>
              
              <!-- 描画領域 (スマホでも綺麗にアスペクト比を維持) -->
              <div class="w-full flex justify-center mb-4">
                <canvas id="experiment-canvas" width="${canvasWidth}" height="${canvasHeight}"></canvas>
              </div>

              <!-- 操作パネル -->
              <div class="w-full max-w-lg bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-md space-y-4">
                <p class="text-xs sm:text-sm font-bold text-slate-700">
                  下のつまみを動かして、２本の横線の長さを合わせてください
                </p>
                
                <!-- スライダーコントロール (高さを確保してタッチしやすく) -->
                <div class="flex items-center space-x-4 w-full py-2">
                  <span class="text-xs font-bold text-slate-400 select-none shrink-0">短く</span>
                  <input type="range" id="length-slider" min="50" max="500" step="1" value="${currentComparisonLength}" class="flex-grow">
                  <span class="text-xs font-bold text-slate-400 select-none shrink-0">長く</span>
                </div>
              </div>
            </div>
          `;
        },
        choices: ['ピッタリ同じ長さになったので決定'],
        button_html: `<button id="confirm-btn" class="jspsych-btn mt-6 mb-12 px-8 py-4 w-full max-w-lg text-base sm:text-lg font-bold text-white bg-indigo-600 rounded-xl shadow-lg hover:bg-indigo-700 transition">%choice%</button>`,
        
        on_load: function() {
          const canvas = document.getElementById('experiment-canvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          const slider = document.getElementById('length-slider');

          // 高解像度ディスプレイ(Retina等)対応
          const dpr = window.devicePixelRatio || 1;
          canvas.width = canvasWidth * dpr;
          canvas.height = canvasHeight * dpr;
          canvas.style.width = '100%';
          canvas.style.maxWidth = `${canvasWidth}px`;
          canvas.style.height = 'auto';
          ctx.scale(dpr, dpr);

          function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // 1. 上段：標準刺激 (内向き矢羽, 200px固定)
            drawArrow(ctx, 350, 130, 200, config.fin_length, config.shaft_angle, -1);

            // 2. 下段：比較刺激 (外向き矢羽, スライダー連動)
            drawArrow(ctx, 350, 270, currentComparisonLength, config.fin_length, config.shaft_angle, 1);
          }

          draw();

          // スライダーイベント
          slider.addEventListener('input', function(e) {
            currentComparisonLength = parseFloat(e.target.value);
            draw();
          });
        },

        on_finish: function(data) {
          data.angle = config.shaft_angle;
          data.wing_length = config.fin_length;
          data.standard_len = 200;
          data.pse = Math.round(currentComparisonLength);
          data.error_amount = Math.round(currentComparisonLength - 200);

          data.initial_length = initialLength;
          data.adjusted_length = data.pse;
          data.illusion_amount = data.error_amount;
        }
      };

      timeline.push(trial);
    });

    // --- STREAMING_CHUNK: Processing data saving screen... ---
    // --- 3. データの自動送信画面 ---
    const send_data_screen = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div class="text-center p-8 sm:p-10 bg-white rounded-3xl shadow-xl max-w-md mx-auto border border-slate-100 my-4">
          <div class="animate-spin inline-block w-12 h-12 border-[4px] border-indigo-600 border-t-transparent rounded-full mb-5"></div>
          <p class="text-lg sm:text-xl font-bold text-slate-800 mb-2">データを保存中...</p>
          <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">測定結果をスプレッドシートに同期しています。<br>このまま少しお待ちください。</p>
        </div>
      `,
      choices: "NO_KEYS",
      on_load: function() {
        const rawTrials = jsPsych.data.get().filter({trial_type: 'html-button-response'}).values();
        const sliderTrials = rawTrials.slice(1); // 最初のインストラクション除外
        
        const structuredPayload = sliderTrials.map((t, idx) => {
          return {
            subject_id: t.subject_id,
            timestamp: t.timestamp,
            trial_no: idx + 1,
            angle: t.angle,
            wing_length: t.wing_length,
            standard_len: t.standard_len,
            pse: t.pse,
            error_amount: t.error_amount
          };
        });

        fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(structuredPayload),
          mode: 'no-cors'
        })
        .then(() => {
          console.log("Data transmission completed");
          setTimeout(() => {
            jsPsych.finishTrial();
          }, 1500);
        })
        .catch(err => {
          console.error("Data transmission failed: ", err);
          jsPsych.data.addProperties({ transmission_failed: true });
          setTimeout(() => {
            jsPsych.finishTrial();
          }, 1500);
        });
      }
    };
    timeline.push(send_data_screen);

    // --- STREAMING_CHUNK: Generating interactive results screen... ---
    // --- 4. 結果表示 & 完了報告画面 ---
    const results_screen = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function() {
        const rawTrials = jsPsych.data.get().filter({trial_type: 'html-button-response'}).values();
        const trials = rawTrials.slice(1);
        const studentId = jsPsych.data.get().select('subject_id').values[0] || "未登録";
        const hasFailed = jsPsych.data.get().select('transmission_failed').values[0] || false;

        // 各条件統計の計算
        const summary = {};
        conditions.forEach(cond => {
          const key = `角度${cond.shaft_angle}° / 長さ${cond.fin_length}px`;
          summary[key] = { sum: 0, count: 0, values: [], rawCond: cond };
        });

        trials.forEach(t => {
          const key = `角度${t.angle}° / 長さ${t.wing_length}px`;
          if (summary[key]) {
            summary[key].sum += t.pse;
            summary[key].count += 1;
            summary[key].values.push(t.pse);
          }
        });

        // テーブル行とグラフデータの構築
        let tableRows = '';
        const chartLabels = [];
        const chartData = [];

        Object.keys(summary).forEach(key => {
          const avg = summary[key].count > 0 ? (summary[key].sum / summary[key].count).toFixed(1) : 0;
          const diff = (avg - 200).toFixed(1);
          chartLabels.push(key);
          chartData.push(diff);

          tableRows += `
            <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
              <td class="px-3 sm:px-5 py-3 text-xs sm:text-sm font-semibold text-slate-700 whitespace-nowrap">${key}</td>
              <td class="px-3 sm:px-5 py-3 text-xs sm:text-sm text-center text-slate-500 whitespace-nowrap">200 px</td>
              <td class="px-3 sm:px-5 py-3 text-xs sm:text-sm text-center font-mono text-slate-800 font-bold whitespace-nowrap">${avg} px</td>
              <td class="px-3 sm:px-5 py-3 text-xs sm:text-sm text-center font-mono ${diff >= 0 ? 'text-rose-500' : 'text-blue-500'} font-bold whitespace-nowrap">
                ${diff >= 0 ? '+' : ''}${diff} px
              </td>
            </tr>
          `;
        });

        let csvContent = "subject_id,timestamp,angle,wing_length,standard_len,pse,error_amount\\n";
        trials.forEach((t) => {
          csvContent += `${t.subject_id},"${t.timestamp}",${t.angle},${t.wing_length},${t.standard_len},${t.pse},${t.error_amount}\\n`;
        });

        // 警告・成功バナーの構築
        let alertBanner = '';
        if (hasFailed) {
          alertBanner = `
            <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-xl">
              <div class="flex items-start gap-2.5">
                <svg class="w-5 h-5 text-red-600 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <div>
                  <h4 class="font-bold text-red-800 text-sm">データの自動アップロードに失敗しました</h4>
                  <p class="text-xs text-red-700 mt-1">ネットワーク制限などの理由により自動送信がブロックされました。お手数ですが、一番下にある「コピーボタン」からデータを取得して手動でご提出ください。</p>
                </div>
              </div>
            </div>
          `;
        } else {
          alertBanner = `
            <div class="mb-6 p-4 bg-emerald-50 border-l-4 border-emerald-500 rounded-r-xl">
              <div class="flex items-start gap-2.5">
                <svg class="w-5 h-5 text-emerald-600 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <div>
                  <h4 class="font-bold text-emerald-800 text-sm">データは正常に自動同期されました！</h4>
                  <p class="text-xs text-emerald-700 mt-1">送信完了しました。念のためコピーデータを保存しておくことをおすすめします。</p>
                </div>
              </div>
            </div>
          `;
        }

        return `
          <div class="text-left bg-white p-5 sm:p-8 rounded-3xl shadow-xl border border-slate-200 max-w-3xl mx-auto space-y-6 my-2">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-center text-slate-800 tracking-tight">
              テストが終了しました！
            </h2>
            
            <div class="text-center text-sm font-mono text-slate-500 bg-slate-50 py-2.5 px-4 rounded-xl border border-slate-100 inline-block w-full">
              対象者ID: <span class="font-bold text-indigo-600">${studentId}</span>
            </div>

            ${alertBanner}
            
            <p class="text-slate-600 text-xs sm:text-sm leading-relaxed">
              <strong>【結果の解説】</strong><br>
              調整後の長さが <strong>200 px（基準線の長さ）</strong> に近いほど錯視の影響が少なく、乖離が大きいほど錯視の影響を強く受けていることを意味します。一般的に、角度が鋭く（15°）、羽が長い（50px）ほど、内向き矢羽を実際より過小評価し、比較する外向き矢羽を長く調整しやすくなるため、錯視量（差分）がプラスに大きくなる傾向にあります。
            </p>

            <!-- グラフ描画エリア -->
            <div class="bg-slate-50 p-3 sm:p-4 rounded-2xl border border-slate-150">
              <h3 class="text-xs sm:text-sm font-bold text-slate-700 mb-3 text-center">条件別 錯視量（平均の差分）グラフ</h3>
              <div class="relative w-full h-48 sm:h-64">
                <canvas id="analysis-chart"></canvas>
              </div>
            </div>

            <h3 class="text-base sm:text-lg font-bold text-slate-800 pt-2">数値結果データ (横スワイプでスクロール可能)</h3>
            
            <!-- 横スクロール可能コンテナ -->
            <div class="overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
              <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                  <tr>
                    <th class="px-3 sm:px-5 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap">条件 (矢羽角度 / 羽長)</th>
                    <th class="px-3 sm:px-5 py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap">標準刺激</th>
                    <th class="px-3 sm:px-5 py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap">調整平均値</th>
                    <th class="px-3 sm:px-5 py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap">錯視量 (差分)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 bg-white">
                  ${tableRows}
                </tbody>
              </table>
            </div>

            <div class="border-t border-slate-100 pt-6 mb-12">
              <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-2">RAWデータ (CSV形式)</label>
              <textarea readonly class="w-full h-28 p-3 text-xs font-mono text-slate-600 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" id="csv-area">${csvContent}</textarea>
              <button onclick="copyCSV(this)" class="mt-3 w-full py-4 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 active:bg-indigo-200 rounded-xl text-sm font-bold transition duration-200 shadow-sm flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                CSVデータをクリップボードにコピー
              </button>
            </div>
          </div>
        `;
      },
      choices: ['NO_KEYS'],
      on_load: function() {
        const rawTrials = jsPsych.data.get().filter({trial_type: 'html-button-response'}).values();
        const trials = rawTrials.slice(1);

        // チャートのデータ集計
        const summary = {};
        conditions.forEach(cond => {
          const key = `角度${cond.shaft_angle}°/羽${cond.fin_length}px`;
          summary[key] = { sum: 0, count: 0 };
        });

        trials.forEach(t => {
          const key = `角度${t.angle}°/羽${t.wing_length}px`;
          if (summary[key]) {
            summary[key].sum += t.pse;
            summary[key].count += 1;
          }
        });

        const labels = Object.keys(summary);
        const dataValues = labels.map(key => {
          const avg = summary[key].count > 0 ? (summary[key].sum / summary[key].count) : 200;
          return parseFloat((avg - 200).toFixed(1));
        });

        // Chart.jsによる美しい棒グラフ生成
        const chartCanvas = document.getElementById('analysis-chart');
        if (chartCanvas) {
          const ctx = chartCanvas.getContext('2d');
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: '錯視量（px）',
                data: dataValues,
                backgroundColor: dataValues.map(val => val >= 0 ? 'rgba(244, 63, 94, 0.65)' : 'rgba(59, 130, 246, 0.65)'),
                borderColor: dataValues.map(val => val >= 0 ? '#f43f5e' : '#3b82f6'),
                borderWidth: 2,
                borderRadius: 8,
                barThickness: window.innerWidth < 640 ? 18 : 32, // モバイルでは細くして見やすく
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      return `錯視量: ${context.raw > 0 ? '+' : ''}${context.raw} px`;
                    }
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  title: { display: true, text: '錯視量(px)', font: { weight: 'bold', size: window.innerWidth < 640 ? 10 : 12 } },
                  grid: { color: 'rgba(0, 0, 0, 0.05)' },
                  labels: { font: { size: 10 } }
                },
                x: {
                  grid: { display: false },
                  ticks: {
                    font: { size: window.innerWidth < 640 ? 8 : 10 },
                    maxRotation: 45,
                    minRotation: 15
                  }
                }
              }
            }
          });
        }
      }
    };
    timeline.push(results_screen);

    // --- STREAMING_CHUNK: Setting up copy handler... ---
    // コピー処理の実装
    window.copyCSV = function(element) {
      const copyText = document.getElementById("csv-area");
      copyText.select();
      copyText.setSelectionRange(0, 99999); // モバイルブラウザ対応
      document.execCommand("copy");
      
      const originalText = element.innerHTML;
      element.innerHTML = `
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
        コピー完了しました！
      `;
      element.classList.remove("bg-indigo-50", "text-indigo-700");
      element.classList.add("bg-emerald-500", "text-white");

      setTimeout(() => {
        element.innerHTML = originalText;
        element.classList.remove("bg-emerald-500", "text-white");
        element.classList.add("bg-indigo-50", "text-indigo-700");
      }, 2000);
    };

    // 実験の実行
    jsPsych.run(timeline);
  </script>
</body>
</html>
