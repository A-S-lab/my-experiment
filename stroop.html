<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop Task (Mobile Support)</title>
    <!-- jsPsych本体とCSS -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
    
    <!-- 使用する各種プラグイン -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    
    <style>
        body {
            background-color: #FFFFFF; /* 背景色: 白 */
            color: #000000; /* 基本文字色: 黒 */
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 刺激（文字）のスタイル */
        .stimulus-text {
            font-size: 64px;
            font-weight: bold;
            display: block;
            margin-bottom: 30px;
        }

        /* 教示テキストのスタイル */
        .instructions-text {
            font-size: 22px;
            line-height: 1.8;
            text-align: center;
            color: #000000; /* 教示は常に黒 */
            padding: 15px;
        }

        /* 注視点 (+) のスタイル */
        .fixation-text {
            font-size: 60px;
            color: #000000;
            font-weight: bold;
        }

        /* 進行状況・送信ステータス画面のスタイル */
        .status-container {
            text-align: center;
            font-size: 20px;
            line-height: 1.6;
            max-width: 600px;
            padding: 20px;
        }

        /* jsPsychのターゲット要素 */
        #jspsych-target {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* スマホ対応：誤タップや自動選択を防止するCSS */
        button, .stimulus-text, .instructions-text, .fixation-text {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* レスポンシブ対応：ボタンがはみ出さないようにラップする */
        .jspsych-btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        /* モバイル用白黒ボタンのタップ時アクティブフィードバック */
        .touch-button {
            transition: background-color 0.1s, color 0.1s;
        }
        .touch-button:active {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        // 送信先GASのURL
        const gas_url = "https://script.google.com/macros/s/AKfycbzToZxRrv-zosv59KOvAw-jJsj8QAh1bG6d22Ll1uUZgfj0JP1T7NIbAdCEO3nN7nfN/exec";

        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                // 実験終了時にデータの整形および自動送信処理を呼び出す
                sendDataWithExponentialBackoff();
            }
        });

        // 一致条件の刺激リスト (Congruent: 3種類)
        const congruent_stimuli = [
            { word: "赤", color: "red", condition: "congruent", correct_response: "r" },
            { word: "青", color: "blue", condition: "congruent", correct_response: "b" },
            { word: "緑", color: "green", condition: "congruent", correct_response: "g" }
        ];

        // 不一致条件の刺激リスト (Incongruent: 6種類)
        const incongruent_stimuli = [
            { word: "赤", color: "blue", condition: "incongruent", correct_response: "b" },
            { word: "赤", color: "green", condition: "incongruent", correct_response: "g" },
            { word: "青", color: "red", condition: "incongruent", correct_response: "r" },
            { word: "青", color: "green", condition: "incongruent", correct_response: "g" },
            { word: "緑", color: "red", condition: "incongruent", correct_response: "r" },
            { word: "緑", color: "blue", condition: "incongruent", correct_response: "b" }
        ];

        // それぞれ10試行ずつランダムに抽出する（復元抽出）
        const congruent_trials = jsPsych.randomization.sampleWithReplacement(congruent_stimuli, 10);
        const incongruent_trials = jsPsych.randomization.sampleWithReplacement(incongruent_stimuli, 10);

        // 2つの配列を結合し、合計20試行のリストを作成してランダムにシャッフルする
        const test_trials_data = jsPsych.randomization.shuffle(congruent_trials.concat(incongruent_trials));

        let timeline = [];

        // 1. 参加者情報入力 (survey-text)
        const participant_info = {
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: '<p class="instructions-text">参加者ID（例：学籍番号）を入力してください：</p>',
                    placeholder: 'IDを入力',
                    required: true,
                    name: 'subject_id'
                }
            ],
            button_label: '次へ',
            on_finish: function(data) {
                // 入力された参加者IDを抽出
                const id = data.response.subject_id.trim();
                // 実施日時（ローカルのJST形式）を取得
                const now = new Date();
                const timestamp = now.getFullYear() + '/' + 
                                  ('0' + (now.getMonth() + 1)).slice(-2) + '/' + 
                                  ('0' + now.getDate()).slice(-2) + ' ' + 
                                  ('0' + now.getHours()).slice(-2) + ':' + 
                                  ('0' + now.getMinutes()).slice(-2) + ':' + 
                                  ('0' + now.getSeconds()).slice(-2);
                
                // 以降のすべてのデータにIDと実施日時をグローバルに保存
                jsPsych.data.addProperties({
                    subject_id: id,
                    timestamp: timestamp
                });
            }
        };
        timeline.push(participant_info);

        // 2. 開始ボタン
        const start_button = {
            type: jsPsychHtmlButtonResponse,
            stimulus: '<p class="instructions-text">ストループ課題を開始します。</p>',
            choices: ['実験を開始する'],
            button_html: '<button class="jspsych-btn" style="font-size: 20px; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; background-color: #ffffff; color: #000000; border: 2px solid #000000;">%choice%</button>'
        };
        timeline.push(start_button);

        // 3. 教示画面 (モバイル対応。白黒を徹底するために文字色装飾を廃止)
        const instructions = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div class="instructions-text">
                    <p>表示される文字の「色」を答えてください。</p>
                    <p>赤色の文字なら <strong>'R' (赤)</strong> ボタン、またはキーボードの <strong>'r'</strong></p>
                    <p>青色の文字なら <strong>'B' (青)</strong> ボタン、またはキーボードの <strong>'b'</strong></p>
                    <p>緑色の文字なら <strong>'G' (緑)</strong> ボタン、またはキーボードの <strong>'g'</strong></p>
                    <br>
                    <p>下のボタンをタップするか、スペースキーを押すと実験が始まります。</p>
                </div>
            `,
            choices: ['実験を始める'],
            button_html: '<button class="jspsych-btn" id="btn-start-task" style="font-size: 20px; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; background-color: #000000; color: #ffffff; border: 2px solid #000000;">%choice%</button>',
            on_load: function() {
                // PC参加者のために、スペースキーが押された際も進めるよう処理を追加
                const handle_space = function(e) {
                    if (e.key === ' ' || e.code === 'Space') {
                        const startBtn = document.getElementById('btn-start-task');
                        if (startBtn) startBtn.click();
                    }
                };
                document.addEventListener('keydown', handle_space);
                window.active_instructions_listener = handle_space;
            },
            on_finish: function() {
                if (window.active_instructions_listener) {
                    document.removeEventListener('keydown', window.active_instructions_listener);
                    window.active_instructions_listener = null;
                }
            },
            post_trial_gap: 500
        };
        timeline.push(instructions);

        // 4. 実験試行ループ
        test_trials_data.forEach((trial_info) => {
            
            // a. 注視点 (+) 500ms
            const fixation = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '<div class="fixation-text">+</div>',
                choices: "NO_KEYS",
                trial_duration: 500,
                data: { task: 'fixation' }
            };

            // b. 刺激提示 (白黒で認知干渉を与えないニュートラルなボタン配置)
            const stimulus = {
                type: jsPsychHtmlButtonResponse,
                stimulus: `<div class="stimulus-text" style="color: ${trial_info.color};">${trial_info.word}</div>`,
                choices: ['R', 'B', 'G'],
                // 各ボタンのHTMLテンプレートを白黒ベースで指定
                button_html: [
                    `<button class="jspsych-btn touch-button" id="btn-r" 
                        style="font-size: 22px; padding: 16px 28px; margin: 8px; border-radius: 12px; 
                        background-color: #ffffff; color: #000000; border: 2px solid #000000; font-weight: bold; 
                        min-width: 100px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; 
                        -webkit-tap-highlight-color: transparent;">
                        赤 (R)
                    </button>`,
                    `<button class="jspsych-btn touch-button" id="btn-b" 
                        style="font-size: 22px; padding: 16px 28px; margin: 8px; border-radius: 12px; 
                        background-color: #ffffff; color: #000000; border: 2px solid #000000; font-weight: bold; 
                        min-width: 100px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; 
                        -webkit-tap-highlight-color: transparent;">
                        青 (B)
                    </button>`,
                    `<button class="jspsych-btn touch-button" id="btn-g" 
                        style="font-size: 22px; padding: 16px 28px; margin: 8px; border-radius: 12px; 
                        background-color: #ffffff; color: #000000; border: 2px solid #000000; font-weight: bold; 
                        min-width: 100px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; 
                        -webkit-tap-highlight-color: transparent;">
                        緑 (G)
                    </button>`
                ],
                data: {
                    task: 'response',
                    word: trial_info.word,
                    color: trial_info.color,
                    condition: trial_info.condition,
                    correct_answer: trial_info.correct_response
                },
                on_load: function() {
                    // PCのキーボード操作に対応するためのフォールバック処理
                    const handle_keydown = function(e) {
                        const key = e.key.toLowerCase();
                        if (key === 'r') {
                            const btn = document.getElementById('btn-r');
                            if (btn) btn.click();
                        } else if (key === 'b') {
                            const btn = document.getElementById('btn-b');
                            if (btn) btn.click();
                        } else if (key === 'g') {
                            const btn = document.getElementById('btn-g');
                            if (btn) btn.click();
                        }
                    };
                    document.addEventListener('keydown', handle_keydown);
                    window.active_stroop_listener = handle_keydown;
                },
                on_finish: function(data) {
                    // リスナーのクリーンアップ
                    if (window.active_stroop_listener) {
                        document.removeEventListener('keydown', window.active_stroop_listener);
                        window.active_stroop_listener = null;
                    }

                    // ボタンインデックスを 'r', 'b', 'g' にマッピング
                    const response_map = {0: 'r', 1: 'b', 2: 'g'};
                    const actual_response = response_map[data.response];
                    
                    data.response = actual_response; // CSV用のレスポンス上書き

                    // 正誤の比較判定
                    const is_correct = (actual_response === data.correct_answer);
                    data.correct = is_correct ? "true" : "false";
                }
            };

            // c. 試行間隔 (ITI) 1000ms
            const iti = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '', // 空白
                choices: "NO_KEYS",
                trial_duration: 1000,
                data: { task: 'iti' }
            };

            timeline.push(fixation, stimulus, iti);
        });

        // 5. データ抽出・CSV作成、およびGASへの送信処理 (指数バックオフ付き)
        async function sendDataWithExponentialBackoff() {
            const display_element = jsPsych.getDisplayElement();
            display_element.innerHTML = `
                <div class="status-container">
                    <h3>実験が終了しました。</h3>
                    <p>データを安全に送信しています。しばらくお待ちください...</p>
                    <div style="margin-top: 20px;">
                        <span id="retry-countdown" style="font-weight: bold; color: #555;">送信中...</span>
                    </div>
                </div>
            `;

            // (1) 反応があった試行のみにフィルタリング
            const filtered_data = jsPsych.data.get().filter({ task: 'response' });

            // (2) 必要な列だけを抽出してオブジェクトの配列に変換
            const rows = filtered_data.values().map(trial => {
                return {
                    subject_id: trial.subject_id || "unknown",
                    timestamp: trial.timestamp || "",
                    word: trial.word,
                    color: trial.color,
                    condition: trial.condition,
                    rt: trial.rt,
                    correct: trial.correct
                };
            });

            // CSV形式の文字列に変換
            const headers = ["subject_id", "timestamp", "word", "color", "condition", "rt", "correct"];
            const csv_content = [
                headers.join(","), // ヘッダー行
                ...rows.map(row => headers.map(fieldName => `"${String(row[fieldName] || '').replace(/"/g, '""')}"`).join(",")) // 各データ行
            ].join("\n");

            // 送信用ペイロード
            const payload = {
                csv_data: csv_content,
                subject_id: rows[0]?.subject_id || "unknown",
                timestamp: rows[0]?.timestamp || ""
            };

            // (3) 指数バックオフによる送信
            const max_retries = 5;
            let success = false;

            for (let attempt = 0; attempt < max_retries; attempt++) {
                try {
                    const response = await fetch(gas_url, {
                        method: 'POST',
                        mode: 'no-cors', // クロスオリジン制約を考慮し no-cors モードを設定（GASでの一般的な受け取り仕様）
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    success = true;
                    break;
                } catch (error) {
                    const retry_delay = Math.pow(2, attempt) * 1000; // 1s, 2s, 4s, 8s, 16s の待機時間
                    
                    if (attempt < max_retries - 1) {
                        for (let sec = retry_delay / 1000; sec > 0; sec--) {
                            const countdown_el = document.getElementById('retry-countdown');
                            if (countdown_el) {
                                countdown_el.textContent = `送信エラーが発生しました。${sec}秒後に再送を試みます (試行 ${attempt + 1}/${max_retries})...`;
                            }
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        }
                    } else {
                        success = false;
                    }
                }
            }

            // (4) 送信結果の画面表示
            if (success) {
                display_element.innerHTML = `
                    <div class="status-container" style="color: #1b5e20;">
                        <h2>実験完了</h2>
                        <p>データは正常に保存されました。ご協力ありがとうございました。</p>
                        <p style="font-size: 16px; color: #555; margin-top: 15px;">ブラウザを閉じるか、タブを終了してください。</p>
                    </div>
                `;
            } else {
                display_element.innerHTML = `
                    <div class="status-container" style="color: #b71c1c;">
                        <h2>送信エラー</h2>
                        <p>データの自動送信に失敗しました。接続環境をご確認ください。</p>
                        <p>お手数をおかけいたしますが、以下のデータをコピーし、実験管理者へお送りください。</p>
                        <textarea readonly style="width: 100%; height: 180px; font-family: monospace; font-size: 12px; margin-top: 10px; padding: 10px; box-sizing: border-box;">${csv_content}</textarea>
                    </div>
                `;
            }
        }

        window.onload = function() {
            jsPsych.run(timeline);
        };

    </script>
</body>
</html>
