<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>jsPsych Experiment</title>
    <!-- jsPsych 7.x CDN -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        /* 仕様1: 背景色は灰色 (#808080) */
        body {
            background-color: #808080;
            color: white; /* 文字を読みやすくするために白に設定 */
        }

        /* 仕様2: 直径100pxの赤い円 */
        .red-circle {
            width: 100px;
            height: 100px;
            background-color: #ff0000;
            border-radius: 50%;
            margin: 0 auto;
        }

        /* jsPsychのコンテナ調整 */
        .jspsych-display-element {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>
</body>
<script>
    /**
     * jsPsychの初期化
     */
    const jsPsych = initJsPsych({
        display_element: 'jspsych-target',
        on_finish: function() {
            // 実験終了時の処理が必要な場合はここに記述
        }
    });

    // タイムラインの作成
    const timeline = [];

    /**
     * 仕様2・3: 赤い円を表示し、スペースキーを待機
     */
    const trial_circle = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <div class="red-circle"></div>
            <p style="margin-top: 20px;">スペースキーを押して次へ</p>
        `,
        choices: [' '], // スペースキーのみ受け付け
        data: {
            task: 'circle_display'
        }
    };
    timeline.push(trial_circle);

    /**
     * 仕様4: 終了メッセージを表示
     */
    const trial_end = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <div style="font-size: 24px;">
                実験が終了しました。
            </div>
        `,
        choices: "NO_KEYS", // キー入力を受け付けない
        duration: 3000      // 3秒後に終了
    };
    timeline.push(trial_end);

    /**
     * 実験の実行
     */
    jsPsych.run(timeline);
</script>
</html>
